spring:
  profiles:
    active: dev # 激活 application-dev.yaml
  application:
    name: LAMP
  datasource:
    # 数据库地址可以保留，但用户名和密码建议使用变量
    url: jdbc:mysql://sh-cynosdbmysql-grp-mtd4hmc8.sql.tencentcdb.com:28669/lamp_health?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:******}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 20000
      pool-name: HikariCP

server:
  port: 6060
  tomcat:
    max-http-form-post-size: 10MB
    connection-timeout: 60000

kouzi:
  agent:
    base-url: https://api.coze.cn/v3/chat
    # Token 仅在 application-dev.yaml 中配置
    token: ${KOUZI_TOKEN:}
    bot-id: "7589593616806068233"

aliyun:
  # 密钥仅在 application-dev.yaml 中配置
  appKey: ${ALIYUN_APP_KEY:}
  accessKeyId: ${ALIYUN_AK_ID:}
  accessKeySecret: ${ALIYUN_AK_SECRET:}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

cos:
  # bucket 需包含 appid 后缀，例如：examplebucket-1250000000
  bucket: lamp-1360220156
  region: ap-nanjing

  # 固定密钥签名，不使用 STS 临时凭证
  use-temp-credential: false

  # 上传限制
  policy-expire-seconds: ${COS_POLICY_EXPIRE_SECONDS:300}
  max-file-size-bytes: ${COS_MAX_FILE_SIZE_BYTES:2097152}

  # 鉴权校验（无统一鉴权时可先关闭）
  require-login: ${COS_REQUIRE_LOGIN:false}
  login-user-header: ${COS_LOGIN_USER_HEADER:X-User-Id}

  # 可选：自定义上传域名 / 访问域名，不填使用默认 COS 域名
  upload-host: ${COS_UPLOAD_HOST:}
  public-host: ${COS_PUBLIC_HOST:}
